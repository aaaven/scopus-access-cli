[metadata]
name = uaeu-scopus-access-layer
version = 0.8.0
description = Local CLI for bounded Scopus search, quota accounting, and exports
long_description = file: README.md
long_description_content_type = text/markdown
license = Proprietary

[options]
python_requires = >=3.9
package_dir =
    = src
packages = find:
include_package_data = True
install_requires =

[options.extras_require]
browser =
    playwright>=1.48,<2

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    scopus-access = scopus_access.cli:main
    scopus-fetch = scopus_access.fetch:main
